<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17204f" />
    <title>研迹 · 考研 11408 学习档案</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <i data-lucide="chart-no-axes-combined"></i>
          </div>
          <div>
            <div class="brand-name">研迹</div>
            <div class="brand-sub">11408 · 2028 考研</div>
          </div>
        </div>

        <div class="nav-label">工作台</div>
        <nav class="nav">
          <button class="nav-item active" data-screen="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>总览</span>
          </button>
          <button class="nav-item" data-screen="summary">
            <i data-lucide="chart-column"></i>
            <span>成绩汇总</span>
          </button>
          <button class="nav-item" data-screen="plan">
            <i data-lucide="calendar-range"></i>
            <span>学习计划</span>
            <span class="nav-badge">7</span>
          </button>
          <button class="nav-item" data-screen="english">
            <i data-lucide="languages"></i>
            <span>英语一 / 二</span>
          </button>
          <button class="nav-item" data-screen="math">
            <i data-lucide="sigma"></i>
            <span>数学一</span>
          </button>
          <button class="nav-item" data-screen="cs408">
            <i data-lucide="cpu"></i>
            <span>408</span>
          </button>
          <button class="nav-item" data-screen="mistakes">
            <i data-lucide="notebook-tabs"></i>
            <span>不会题 / 错题本</span>
            <span class="nav-badge">31</span>
          </button>
        </nav>

        <div class="nav-label">设置</div>
        <nav class="nav">
          <button class="nav-item" data-screen="goal">
            <i data-lucide="target"></i>
            <span>目标与倒计时</span>
          </button>
          <button class="nav-item" data-screen="data">
            <i data-lucide="database-backup"></i>
            <span>数据与备份</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="sync-line">
            <span class="sync-dot"></span>
            <span>已同步 · 今天 21:36</span>
          </div>
          <div class="user-mini">
            <div class="avatar">研</div>
            <div>
              <div class="user-name">我的备考空间</div>
              <div class="user-plan">单人账号 · 手机 / 电脑同步</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <div class="crumb">11408 / <strong id="crumb-current">总览</strong></div>
          <label class="search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="搜索真题、章节、错题或计划" />
          </label>
          <div class="top-actions">
            <button class="primary-btn" id="open-entry" data-open-entry="create">
              <i data-lucide="plus"></i>
              <span class="btn-label">录入成绩</span>
            </button>
            <button class="icon-btn" aria-label="通知">
              <i data-lucide="bell"></i>
              <span class="notify-dot"></span>
            </button>
            <button class="icon-btn" aria-label="设置">
              <i data-lucide="settings-2"></i>
            </button>
          </div>
        </header>

        <main class="content" id="app"></main>
      </div>
    </div>

    <nav class="mobile-nav">
      <button class="active" data-screen="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>总览</span>
      </button>
      <button data-screen="summary">
        <i data-lucide="chart-column"></i>
        <span>汇总</span>
      </button>
      <button data-screen="plan">
        <i data-lucide="calendar-range"></i>
        <span>计划</span>
      </button>
      <button data-screen="english">
        <i data-lucide="languages"></i>
        <span>英语</span>
      </button>
      <button data-screen="math">
        <i data-lucide="sigma"></i>
        <span>数学</span>
      </button>
      <button data-screen="cs408">
        <i data-lucide="cpu"></i>
        <span>408</span>
      </button>
    </nav>

    <div class="modal-backdrop" id="entry-modal">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="entry-title">
        <div class="modal-head">
          <div>
            <h2 class="modal-title" id="entry-title">录入成绩与进度</h2>
            <p class="modal-sub">整卷、单模块、章节练习、逐题错题和学习进度都能录入；保存后自动汇总到年度、科目与总成绩。</p>
          </div>
          <button class="icon-btn" id="close-entry" aria-label="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-tabs" id="entry-mode-tabs">
            <button class="active" type="button" data-entry-mode="create">新增记录</button>
            <button type="button" data-entry-mode="edit">编辑已有记录</button>
          </div>
          <div class="record-banner" id="edit-banner">
            <span class="tag blue">编辑中</span>
            <span id="edit-banner-text">数学一 · 2026 数学一真题 · 第 12 题</span>
            <button class="ghost-btn" id="cancel-edit" type="button">取消编辑</button>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="entry-date">日期</label>
              <input id="entry-date" type="date" value="2026-09-27" />
            </div>
            <div class="field">
              <label for="entry-subject">科目</label>
              <select id="entry-subject">
                <option>数学一</option>
                <option>英语一</option>
                <option>英语二</option>
                <option>408</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-source">来源 / 试卷</label>
              <select id="entry-source">
                <option>数学一真题</option>
                <option>数学二真题</option>
                <option>数学三真题</option>
                <option>1000题</option>
                <option>660</option>
                <option>880</option>
                <option>新东方1000题</option>
                <option>英语一真题</option>
                <option>英语二真题</option>
                <option>王道课后题</option>
                <option>408真题</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-year">年份</label>
              <select id="entry-year">
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
                <option>2021</option>
                <option>2020</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-paper-type">卷种 / 类别</label>
              <select id="entry-paper-type">
                <option>数学一</option>
                <option>数学二</option>
                <option>数学三</option>
                <option>英语一</option>
                <option>英语二</option>
                <option>408</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-module">模块 / 章节</label>
              <select id="entry-module">
                <option>高等数学 · 多元函数微分学</option>
                <option>高等数学 · 无穷级数</option>
                <option>线性代数 · 特征值与特征向量</option>
                <option>概率论 · 多维随机变量</option>
                <option>英语阅读 Part A</option>
                <option>英语完形</option>
                <option>王道 · 计算机组成原理</option>
                <option>408 真题</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-question">题号（可选）</label>
              <input id="entry-question" type="text" value="第 12 题" placeholder="例如 第 12 题 / Text 3 第 4 题" />
            </div>
            <div class="field">
              <label for="entry-status">记录类型</label>
              <select id="entry-status">
                <option>套卷成绩</option>
                <option>章节练习</option>
                <option>错题复盘</option>
                <option>一直不会的题</option>
                <option>学习进度</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-full">满分</label>
              <input id="entry-full" type="number" value="40" />
            </div>
            <div class="field">
              <label for="entry-score">得分</label>
              <input id="entry-score" type="number" value="28" />
            </div>
            <div class="field">
              <label for="entry-lost">失分（自动）</label>
              <input id="entry-lost" type="number" value="12" readonly />
            </div>
            <div class="field">
              <label for="entry-correct">正确题数</label>
              <div class="input-suffix">
                <input id="entry-correct" type="number" value="14" />
                <span>/ 20</span>
              </div>
            </div>
            <div class="field">
              <label for="entry-time">用时</label>
              <div class="input-suffix">
                <input id="entry-time" type="number" value="52" />
                <span>分钟</span>
              </div>
            </div>
            <div class="field">
              <label for="entry-error-type">错误类型</label>
              <select id="entry-error-type">
                <option>计算错误</option>
                <option>概念不清</option>
                <option>审题错误</option>
                <option>时间不足</option>
                <option>一直不会</option>
              </select>
            </div>
            <div class="field">
              <label for="entry-review">下次复盘</label>
              <input id="entry-review" type="date" value="2026-09-30" />
            </div>
            <div class="field span-12">
              <label for="entry-note">复盘备注</label>
              <textarea id="entry-note">第 12 题二阶偏导符号错误，第 17 题链式法则漏乘。两题标记为“一直不会”，安排 3 天后、7 天后再次复盘。</textarea>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <div class="modal-foot-note">失分自动计算；保存后同步更新年度总分、得分图和失分模块图。</div>
          <div class="modal-actions">
            <button class="secondary-btn" id="cancel-entry">取消</button>
            <button class="primary-btn" id="save-entry">
              <i data-lucide="check"></i>
              <span>保存记录</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="./vendor/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
