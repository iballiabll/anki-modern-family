# /etc/nginx/sites-available/iball-cabin  →  软链到 sites-enabled/
# 证书由 certbot 自动补进 listen 443 那段。

server {
    listen 80;
    listen [::]:80;
    server_name app.iball.top;

    # certbot 的验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.iball.top;

    # certbot --nginx 会自动填这两行
    # ssl_certificate     /etc/letsencrypt/live/app.iball.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.iball.top/privkey.pem;

    root /srv/iball-cabin/app/public;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1200;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # 音频雪碧图要拖进度条
    location /movie-data/audio/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # 生成数据：内容变了文件名才变，可以放心长缓存
    location ~ ^/(materials|movie-data|vocab-index|study-data|writing-data)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /vocab-index.json {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /collocation-index.json {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /resources.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # 账号接口：交给 Node，绝不能被静态文件或缓存命中
    location /api/ {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4175;
        access_log off;
    }

    # HTML 每次都回源校验，避免更新后看到旧页面
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
