          <h1 id="pageTitle">考研英语作文高级表达语料库</h1>
          <p class="wcorpus-lead">
            作文里想换掉 important、improve、cause 这类「基础表达」时，来这里查一个更高级、更贴语境的写法：
            第一部分按语义分类整理
            <strong>单词类同义替换</strong>（基础表达 → 高级单词 → 中文含义 → 推荐搭配），
            第二部分是
            <strong>高频词组与功能句</strong>（含推荐用法）。支持中英关键词搜索、按分类浏览与一键复制。
          </p>
