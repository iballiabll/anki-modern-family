<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Modern Family S01E01 追剧英语卡片，可在手机和电脑上直接查看与下载。"
    />
    <title>Modern Family S01E01 · 追剧英语</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">MF</span>
          <div>
            <p class="eyebrow">追剧英语</p>
            <h1>Modern Family <span>S01E01</span></h1>
          </div>
        </div>
        <p class="card-count" id="cardCount" aria-live="polite">
          <strong id="visibleCount">0</strong>
          <span>/</span>
          <span id="totalCount">0</span>
          <span>张卡片</span>
        </p>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="卡片工具">
        <label class="search-field" for="searchInput">
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            id="searchInput"
            type="search"
            placeholder="搜索英文、中文或音标"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clearSearch" class="clear-button" type="button" aria-label="清除搜索" hidden>
            <span aria-hidden="true"></span>
          </button>
        </label>
        <a
          class="download-button"
          href="./anki-modern-family-S01E01.csv"
          download="anki-modern-family-S01E01.csv"
        >
          下载 Anki CSV
        </a>
      </section>

      <section id="cardGrid" class="card-grid" aria-label="英语卡片"></section>

      <div id="emptyState" class="empty-state" hidden>
        <strong>没有找到匹配的卡片</strong>
        <span>换一个关键词试试</span>
      </div>
    </main>

    <footer>
      <p id="deckName">追剧英语 :: Modern Family</p>
      <p>Modern Family S01E01</p>
    </footer>
  </body>
</html>
